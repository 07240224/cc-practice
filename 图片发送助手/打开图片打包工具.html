<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片原图打包</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#233f32;font:16px/1.7 system-ui,sans-serif}main{max-width:900px;margin:8vh auto;padding:32px;background:#fff;border:1px solid #dce4d7;border-radius:18px}h1{margin:0 0 8px;font-size:30px}p{color:#5f6e61}.drop{padding:36px 20px;border:2px dashed #93b59c;border-radius:12px;text-align:center;background:#f6faf4}.drop.over{background:#e8f4e8}button,.pick{display:inline-block;border:0;background:#37634c;color:white;padding:12px 22px;border-radius:8px;cursor:pointer;font:inherit}button:disabled{background:#adb8ae;cursor:wait}input{display:none}li{padding:8px;border-bottom:1px solid #eee}#files{padding:0;list-style:none}#status{white-space:pre-wrap;margin:20px 0}a{display:block;margin:10px 0;color:#276045}small{color:#71816f}</style><main><h1>图片原图打包</h1><p>把原图打成 ZIP，作为文件附件发送到原对话。保留原始文件字节，不缩图、不降低清晰度；全程在本机处理。</p><div id="drop" class="drop"><label class="pick">选择图片<input id="input" type="file" accept="image/*" multiple></label><p>也可拖入图片，或在这里按 Ctrl+V 粘贴截图</p></div><ul id="files"></ul><button id="pack">下载原图 ZIP</button> <button id="clear" style="background:#738475">清空</button><div id="status" role="status">选择图片后点击打包。</div><div id="downloads"></div><small>每个 ZIP 最大24 MiB，超出后自动分包。将 ZIP 作为文件附件发送；此工具不修改 Codex 的消息上限。</small></main><script>
'use strict';
const selected=[],urls=[],LIMIT=24*1024*1024,enc=new TextEncoder(),crcTable=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;crcTable[i]=c>>>0}
function crc32(a){let c=0xffffffff;for(let i=0;i<a.length;i++)c=crcTable[(c^a[i])&255]^(c>>>8);return(c^0xffffffff)>>>0}
function nameBytes(file,index){return enc.encode(String(index+1).padStart(3,'0')+'-'+file.name.replace(/[\\/\x00]/g,'_'))}
function estimate(file,index){return file.size+nameBytes(file,index).length*2+76}
async function createZip(files,baseIndex=0){const chunks=[],directory=[];let offset=0;for(let i=0;i<files.length;i++){const f=files[i],name=nameBytes(f,baseIndex+i),data=new Uint8Array(await f.arrayBuffer()),crc=crc32(data),head=new Uint8Array(30+name.length),v=new DataView(head.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(10,0,true);v.setUint16(12,33,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);head.set(name,30);const central=new Uint8Array(46+name.length),w=new DataView(central.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x800,true);w.setUint16(12,0,true);w.setUint16(14,33,true);w.setUint32(16,crc,true);w.setUint32(20,data.length,true);w.setUint32(24,data.length,true);w.setUint16(28,name.length,true);w.setUint32(42,offset,true);central.set(name,46);chunks.push(head,data);directory.push(central);offset+=head.length+data.length}const centralSize=directory.reduce((n,c)=>n+c.length,0),end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);return new Blob([...chunks,...directory,end],{type:'application/zip'})}
function batches(files){const result=[];let group=[],size=22,index=0;for(const f of files){const n=estimate(f,index++);if(n+22>LIMIT)throw Error('图片“'+f.name+'”超过单包24 MiB，请将这张原图改用共享文件链接。');if(group.length&&(size+n>LIMIT||group.length>=1000)){result.push(group);group=[];size=22}group.push(f);size+=n}if(group.length)result.push(group);return result}
function addFiles(files){for(const f of files)if(f.type.startsWith('image/')||/\.(png|jpe?g|webp|gif|bmp|tiff?)$/i.test(f.name))selected.push(f);const list=document.querySelector('#files');list.replaceChildren();for(const f of selected){const li=document.createElement('li');li.textContent=f.name+' · '+(f.size/1024/1024).toFixed(2)+' MiB';list.append(li)}document.querySelector('#status').textContent=selected.length?'已选择 '+selected.length+' 张图片。':'请选择图片。'}
const drop=document.querySelector('#drop');document.querySelector('#input').onchange=e=>{addFiles(e.target.files);e.target.value=''};for(const kind of ['dragenter','dragover'])drop.addEventListener(kind,e=>{e.preventDefault();drop.classList.add('over')});drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files)};document.addEventListener('paste',e=>{const files=[...e.clipboardData.items].filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);if(files.length){e.preventDefault();addFiles(files)}});document.querySelector('#clear').onclick=()=>{selected.length=0;addFiles([]);for(const u of urls)URL.revokeObjectURL(u);urls.length=0;document.querySelector('#downloads').replaceChildren()};document.querySelector('#pack').onclick=async()=>{const button=document.querySelector('#pack'),status=document.querySelector('#status');if(!selected.length){status.textContent='先选择或粘贴图片。';return}button.disabled=true;try{const groups=batches(selected),links=document.querySelector('#downloads');links.replaceChildren();let index=0;for(let i=0;i<groups.length;i++){status.textContent='正在打包 '+(i+1)+' / '+groups.length;const blob=await createZip(groups[i],index);index+=groups[i].length;const url=URL.createObjectURL(blob);urls.push(url);const a=document.createElement('a');a.href=url;a.download='images-'+String(i+1).padStart(2,'0')+'.zip';a.textContent='下载 '+a.download+' · '+(blob.size/1024/1024).toFixed(2)+' MiB';links.append(a);if(groups.length===1)a.click()}status.textContent='已生成 '+groups.length+' 个 ZIP。把 ZIP 作为文件附件发送到原对话；原图内容保持不变。'}catch(e){status.textContent=e.message}finally{button.disabled=false}};
</script></html>
